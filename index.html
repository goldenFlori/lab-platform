<!doctype html>
<html lang="sq" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab Platform</title>
    <meta name="description" content="Programming labs that run in the browser: Python notebooks, auto-grading, live classes and an AI tutor for university courses." />
    <!-- Link previews (LinkedIn, Slack, WhatsApp, X). Crawlers do not run JavaScript, so these stay in the static HTML. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lab Platform" />
    <meta property="og:title" content="Lab Platform – programming labs that run in the browser" />
    <meta property="og:description" content="Python notebooks, auto-grading, live classes and an AI tutor for university programming courses." />
    <meta property="og:url" content="https://lab-platform.florjanimema.workers.dev/" />
    <meta property="og:image" content="https://lab-platform.florjanimema.workers.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lab Platform: programming labs that run in the browser" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1426" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Lab Platform" />
    <script>
      // Applies the theme before the first paint, so it never flashes. Same rules as src/web/lib/theme.ts.
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch {}
        const dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        const root = document.documentElement;
        root.classList.remove('light', 'dark');
        root.classList.add(dark ? 'dark' : 'light');
        root.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body class="min-h-dvh">
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
