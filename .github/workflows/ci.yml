# Lint, typecheck, test, build and end-to-end tests on every pull request and on main.
# On main, once everything passes, deploy to Cloudflare.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push replaces checks still running on a pull request; runs on main always finish, so a
# deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrations match the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "::error::The schema changed without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain migrations
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Route tree is committed and up to date
        run: |
          if [ -n "$(git status --porcelain src/web/routeTree.gen.ts)" ]; then
            echo "::error::src/web/routeTree.gen.ts is out of date. Run 'npm run build' and commit it."
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: https://lab-platform.florjanimema.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Before the new code, so it never runs against an older schema. Migrations stay additive,
      # so the code still running until the deploy finishes keeps working.
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Build and deploy
        run: npm run deploy

      - name: Check the live site
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$SITE_URL/api/health"
